    <title>Fastmate - 로그인</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <link rel="manifest" href="/manifest.json">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">



    <style>
        /* login.html 전용 스타일 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 16px;
            background-color: #f0f2f5;
            font-family: 'Noto Sans KR', sans-serif;
            box-sizing: border-box;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            box-sizing: border-box;
            margin: 0 auto;
        }
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1c8e3e;
            margin: 0 0 15px 0;
        }
        .login-subtitle {
            font-size: 1rem;
            color: #777;
            margin: 0 0 30px 0;
        }
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .input-group label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #1c8e3e;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
        }
        .forgot-password {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #555;
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #aaa;
            margin: 30px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        .google-login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            color: #333;
            cursor: pointer;
        }
        .google-login-btn svg { width: 20px; height: 20px; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>로그인</h2>
        <div class="input-group">
            <input type="email" id="email" placeholder="이메일 주소">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="비밀번호">
        </div>
        <button id="emailLoginBtn" class="main-button">로그인</button>
        <p class="divider">또는</p>
        <button id="googleLoginBtn" class="social-button google">
            <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Google로 로그인
        </button>
        <button id="kakaoLoginBtn" class="social-button kakao">
            <!-- 카카오 이미지 URL 수정 -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="Kakao">
            카카오로 로그인
        </button>
        <p class="signup-link">계정이 없다면 <a href="./signup.html">회원가입하기</a></p>
      </div>
      <!-- 준비중 모달 -->
<div id="prepareModal" class="modal" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
  <div style="background:white; padding:24px; border-radius:12px; text-align:center; max-width:300px; margin:20px;">
    <p style="margin:0 0 16px; font-size:1.1rem;">카카오 로그인은 준비중입니다 🙏</p>
    <button id="closePrepareModal" style="padding:10px 24px; background:#1c8e3e; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">확인</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script defer src="/firebase-init.js?v=2025.09.06-v8"></script>

        
<script>
document.addEventListener('DOMContentLoaded', () => {
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailLoginBtn = document.getElementById('emailLoginBtn');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const kakaoLoginBtn = document.getElementById('kakaoLoginBtn');

    // ========================================
    // 이미 로그인 상태면 메인페이지로
    // ========================================
    let redirected = false;
    auth.onAuthStateChanged((user) => {
        if (user && !redirected) {
            redirected = true;
            window.location.href = './fastmate.html';
        }
    });

    // ========================================
    // 이메일/비밀번호 로그인
    // ========================================
    emailLoginBtn?.addEventListener('click', async () => {
        const email = (emailInput?.value || '').trim();
        const password = passwordInput?.value || '';

        if (!email || !password) {
            showModal('이메일과 비밀번호를 입력해주세요.');
            return;
        }

        emailLoginBtn.disabled = true;
        try {
            await auth.signInWithEmailAndPassword(email, password);
        } catch (e) {
            console.error(e);
            let msg = '로그인에 실패했습니다.';
            if (e.code === 'auth/user-not-found') {
                msg = '등록되지 않은 이메일입니다.';
            } else if (e.code === 'auth/wrong-password') {
                msg = '비밀번호가 올바르지 않습니다.';
            } else if (e.code === 'auth/invalid-email') {
                msg = '이메일 형식이 올바르지 않습니다.';
            } else if (e.code === 'auth/too-many-requests') {
                msg = '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.';
            }
            showModal(msg);
        } finally {
            emailLoginBtn.disabled = false;
        }
    });

    // Enter 키로 로그인
    passwordInput?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            emailLoginBtn?.click();
        }
    });

    // ========================================
    // 구글 로그인
    // ========================================
    googleLoginBtn?.addEventListener('click', async () => {
        if (googleLoginBtn.disabled) return;
        googleLoginBtn.disabled = true;

        try {
            const user = await signInWithGoogle();
            if (!user) {
                console.log('Google 로그인: 팝업 닫힘 또는 리다이렉트 진행 중');
            }
        } catch (e) {
            console.error(e);
            showModal(e.message || 'Google 로그인에 실패했습니다.');
        } finally {
            googleLoginBtn.disabled = false;
        }
    });

    // ========================================
    // 카카오 로그인 (PWA 만들기 직전에 할 예정)
    // ========================================
    kakaoLoginBtn?.addEventListener('click', () => {
        showModal('카카오 로그인은 준비중입니다 🙏');
    });

    // ========================================
    // 모달 함수
    // ========================================
    function showModal(message) {
        const modal = document.getElementById('alertModal');
        const msgEl = document.getElementById('alertModalMessage');
        if (modal && msgEl) {
            msgEl.textContent = message;
            modal.style.display = 'flex';
        }
    }

    // 모달 닫기
    document.getElementById('closeAlertModal')?.addEventListener('click', () => {
        document.getElementById('alertModal').style.display = 'none';
    });

    // 배경 클릭 시 닫기
    document.getElementById('alertModal')?.addEventListener('click', (e) => {
        if (e.target.id === 'alertModal') {
            e.target.style.display = 'none';
        }
    });
});
</script>
