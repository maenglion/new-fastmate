<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Health 연동 중...</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="/firebase-init.js?v=2026.07.20"></script>
  <style>
    :root { --primary-color: #1c8e3e; --bg-color: #f0f2f5; --card-bg: #ffffff; --text-color: #333; --text-light: #777; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 40px 30px; text-align: center; max-width: 360px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h2 { font-size: 1.2rem; color: var(--text-color); margin-bottom: 8px; }
    p { font-size: 0.9rem; color: var(--text-light); line-height: 1.5; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: var(--primary-color); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #e74c3c; }
  </style>
</head>
<body>
<div class="card" id="statusCard">
  <div class="spinner" id="spinner"></div>
  <h2 id="statusTitle">Google Health 연동 중...</h2>
  <p id="statusMsg">잠시만 기다려주세요.</p>
</div>

<script>
(function() {
  function setStatus(icon, title, msg, isError) {
    const card = document.getElementById('statusCard');
    card.innerHTML = `<div class="icon">${icon}</div><h2 class="${isError?'error':''}">${title}</h2><p>${msg}</p>`;
  }

  // ── 1. hash fragment에서 access_token 추출 (implicit flow) ──
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const accessToken = hashParams.get('access_token');
  const expiresIn   = parseInt(hashParams.get('expires_in') || '3600', 10);
  const hashError   = hashParams.get('error');

  // ── 2. query string에서 error 확인 ──
  const qParams = new URLSearchParams(window.location.search);
  const qError  = qParams.get('error');

  if (hashError || qError) {
    setStatus('❌', '연동 취소됨', '사용자가 연동을 취소했습니다.<br>마이페이지로 돌아갑니다.', true);
    setTimeout(() => window.location.href = '/mypage.html', 2000);
    return;
  }

  if (!accessToken) {
    // hash에 토큰이 없으면 — 페이지 로드 타이밍 문제일 수 있으므로 잠시 후 재시도
    setTimeout(() => {
      const retryHash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const retryToken = retryHash.get('access_token');
      if (!retryToken) {
        setStatus('❌', '토큰 없음', '인증 정보를 받지 못했습니다.<br>다시 시도해주세요.', true);
        setTimeout(() => window.location.href = '/mypage.html', 3000);
      } else {
        proceedWithToken(retryToken, parseInt(retryHash.get('expires_in') || '3600', 10));
      }
    }, 500);
    return;
  }

  proceedWithToken(accessToken, expiresIn);

  function proceedWithToken(token, expSec) {
    // Firebase auth 준비 대기
    function waitForAuth(cb) {
      if (window.auth) {
        window.auth.onAuthStateChanged(user => {
          if (user) cb(user);
          else {
            setStatus('❌', '로그인 필요', '로그인 후 다시 시도해주세요.', true);
            setTimeout(() => window.location.href = '/login.html', 2000);
          }
        });
      } else {
        setTimeout(() => waitForAuth(cb), 200);
      }
    }

    waitForAuth(async (user) => {
      try {
        const db = window.db || firebase.firestore();
        const expiresAt = Date.now() + expSec * 1000;

        // Firestore에 토큰 저장
        await db.collection('users').doc(user.uid)
          .collection('integrations').doc('googleHealth')
          .set({
            accessToken: token,
            expiresAt,
            connectedAt: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'connected'
          }, { merge: true });

        setStatus('✅', '연동 완료!', '데이터를 가져오는 중입니다...', false);

        // 데이터 동기화
        await syncGoogleHealthData(user, db, token);

        setStatus('✅', '연동 완료!', '운동 기록, 걸음수, 칼로리를 가져왔습니다.<br>마이페이지로 이동합니다.', false);
        setTimeout(() => window.location.href = '/mypage.html', 2000);

      } catch (e) {
        console.error('Google Health callback error:', e);
        setStatus('❌', '연동 실패', `오류: ${e.message}`, true);
      }
    });
  }

  // ── Google Health API 데이터 동기화 ──
  async function syncGoogleHealthData(user, db, token) {
    const uid = user.uid;
    const today = new Date();
    const from  = new Date(today.getTime() - 30 * 24 * 3600 * 1000);
    const fromISO = from.toISOString().split('.')[0] + 'Z';
    const toISO   = today.toISOString().split('.')[0] + 'Z';
    const fromDate = fromISO.split('T')[0];
    const toDate   = toISO.split('T')[0];

    const EXERCISE_MAP = {
      'WALKING':'걷기','RUNNING':'달리기','YOGA':'요가',
      'STRENGTH_TRAINING':'근력운동','WEIGHT_TRAINING':'근력운동',
      'SWIMMING':'수영','BIKING':'자전거','CYCLING':'자전거',
      'HIKING':'등산','JUMP_ROPE':'줄넘기','PILATES':'필라테스',
      'DANCING':'댄스','CIRCUIT_TRAINING':'서킷트레이닝',
      'STAIR_CLIMBING':'계단','BALLET':'발레','TENNIS':'테니스'
    };
    const H = { 'Authorization': `Bearer ${token}` };

    // 1. 운동 기록
    try {
      const r = await fetch(
        `https://health.googleapis.com/v4/users/me/dataTypes/exercise/dataPoints?filter=${encodeURIComponent(`exercise.interval.start_time >= "${fromISO}" AND exercise.interval.start_time < "${toISO}"`)}&pageSize=100`,
        { headers: H }
      );
      if (r.ok) {
        const { dataPoints = [] } = await r.json();
        if (dataPoints.length) {
          const batch = db.batch();
          for (const pt of dataPoints) {
            const ex = pt.exercise || {};
            const st = new Date(ex.interval?.startTime || pt.startTime);
            const type = EXERCISE_MAP[ex.exerciseType] || '기타';
            const dur  = Math.round(parseInt((ex.activeDuration||'0s').replace('s',''),10)/60)||1;
            const cal  = Math.round(ex.metricsSummary?.caloriesKcal||0);
            batch.set(
              db.collection('users').doc(uid).collection('measurements').doc('exercise').collection('items').doc(`gh_${st.getTime()}`),
              { date:st, type, duration:dur, calories:cal, source:'googleHealth', rawType:ex.exerciseType||'', createdAt:firebase.firestore.FieldValue.serverTimestamp() },
              { merge:true }
            );
          }
          await batch.commit();
        }
      }
    } catch(e) { console.warn('exercise sync:', e); }

    // 2. 걸음수
    try {
      const r = await fetch(
        `https://health.googleapis.com/v4/users/me/dataTypes/steps/dataPoints:dailyRollUp?filter=${encodeURIComponent(`steps.date >= "${fromDate}" AND steps.date <= "${toDate}"`)}`,
        { headers: H }
      );
      if (r.ok) {
        const { dataPoints = [] } = await r.json();
        if (dataPoints.length) {
          const batch = db.batch();
          for (const pt of dataPoints) {
            const d = pt.steps?.date || pt.date; if (!d) continue;
            batch.set(db.collection('users').doc(uid).collection('dailyStats').doc(`steps_${d}`),
              { date:d, steps:pt.steps?.countSum||0, source:'googleHealth', updatedAt:firebase.firestore.FieldValue.serverTimestamp() },
              { merge:true });
          }
          await batch.commit();
        }
      }
    } catch(e) { console.warn('steps sync:', e); }

    // 3. 일일 칼로리
    try {
      const r = await fetch(
        `https://health.googleapis.com/v4/users/me/dataTypes/active-energy-burned/dataPoints:dailyRollUp?filter=${encodeURIComponent(`active_energy_burned.date >= "${fromDate}" AND active_energy_burned.date <= "${toDate}"`)}`,
        { headers: H }
      );
      if (r.ok) {
        const { dataPoints = [] } = await r.json();
        if (dataPoints.length) {
          const batch = db.batch();
          for (const pt of dataPoints) {
            const d = pt.active_energy_burned?.date || pt.date; if (!d) continue;
            batch.set(db.collection('users').doc(uid).collection('dailyStats').doc(`steps_${d}`),
              { date:d, dailyCalories:Math.round(pt.active_energy_burned?.kilocaloriesSum||0), source:'googleHealth', updatedAt:firebase.firestore.FieldValue.serverTimestamp() },
              { merge:true });
          }
          await batch.commit();
        }
      }
    } catch(e) { console.warn('calories sync:', e); }
  }
})();
</script>
</body>
</html>
