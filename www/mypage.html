<script>
    document.addEventListener('DOMContentLoaded', () => {

        // 1. 전역 도구 및 변수 준비
        const auth = window.auth || firebase.auth();
        const db = window.db || firebase.firestore();
        const getUserDoc = window.getUserDoc || async function(uid) {
            const snap = await db.collection('users').doc(uid).get();
            return snap.exists ? snap.data() : null;
        };
        const signOutUser = window.appSignOut || function() { return auth.signOut(); };
        
        let currentUser = null;
        let allCharts = {};
        let allData = {};
        let fastingCurrentPage = 1;
        let exerciseCurrentPage = 1;
        const itemsPerPage = 7;

        // 2. DOM 요소 캐시
        const pfNickname = document.getElementById('pfNickname');
        const pfEmail = document.getElementById('pfEmail');
        const pfGoals = document.getElementById('pfGoals');
        const homeBtn = document.getElementById('homeBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const fastingHistoryList = document.getElementById('fastingHistoryList');
        const fastingPaginationControls = document.getElementById('fastingPaginationControls');
        const exerciseHistoryList = document.getElementById('exerciseHistoryList');
        const exercisePaginationControls = document.getElementById('exercisePaginationControls');
        const tabs = document.querySelectorAll('.tab-button');
        const dateRangeSelector = document.getElementById('dateRangeSelector');

        // 3. 데이터 조회 함수
        async function fetchHistory(collectionName, orderByField = 'date') {
            if (!currentUser) return [];
            try {
                const snap = await db.collection('users').doc(currentUser.uid).collection(collectionName).orderBy(orderByField, 'desc').limit(200).get();
                return snap.docs.map(doc => {
                    const data = doc.data();
                    return {
                        id: doc.id, ...data,
                        date: data.date?.toDate?.(), startTime: data.startTime?.toDate?.(),
                        endTime: data.endTime?.toDate?.(), createdAt: data.createdAt?.toDate?.()
                    };
                });
            } catch (error) { console.error(`${collectionName} 데이터 로딩 실패:`, error); return []; }
        }

        async function deleteFastingRecord(docId) {
            if (!currentUser || !docId) return;
            if (confirm('이 단식 기록을 정말로 삭제하시겠습니까?')) {
                try {
                    await db.collection('users').doc(currentUser.uid).collection('fastingHistory').doc(docId).delete();
                    allData.fasting = allData.fasting.filter(item => item.id !== docId);
                    renderFastingHistory();
                    alert('기록이 삭제되었습니다.');
                } catch (error) { alert('기록 삭제에 실패했습니다.'); }
            }
        }

        // 4. 화면 렌더링 함수 (UI 업데이트)
        function renderProfileCard() {
            if (!currentUser || !allData.profile) return;
            
            const profile = allData.profile;
            const user = currentUser;

            const nickname = profile.nickname || profile.displayName || user.displayName || '사용자';
            if (pfNickname) pfNickname.textContent = `${nickname}님`;
            if (pfEmail) pfEmail.textContent = user.email || '이메일 정보 없음';
            
            const goals = profile.onboarding?.reasons || [];
            if (pfGoals) {
                pfGoals.innerHTML = '';
                if (goals.length > 0) {
                    goals.forEach(goalText => {
                        const tag = document.createElement('div');
                        tag.className = 'goal-tag';
                        tag.textContent = goalText;
                        pfGoals.appendChild(tag);
                    });
                } else {
                    pfGoals.textContent = '설정된 목표가 없습니다.';
                }
            }
        }

        function renderPagination(container, currentPage, totalPages, onPageChange) {
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            container.innerHTML = `<button class="prev-page" ${currentPage === 1 ? 'disabled' : ''}>&lt;</button><span>${currentPage}/${totalPages}</span><button class="next-page" ${currentPage === totalPages ? 'disabled' : ''}>&gt;</button>`;
            container.querySelector('.prev-page')?.addEventListener('click', () => onPageChange(currentPage - 1));
            container.querySelector('.next-page')?.addEventListener('click', () => onPageChange(currentPage + 1));
        }

        function renderHistory(listEl, paginationEl, data, page, renderItemFn, onPageChange) {
            listEl.innerHTML = '';
            if (!data || data.length === 0) {
                listEl.innerHTML = '<li style="text-align:center;color:var(--text-light);padding:20px 0;">기록이 없습니다.</li>';
                paginationEl.innerHTML = ''; return;
            }
            const totalPages = Math.ceil(data.length / itemsPerPage);
            const pageItems = data.slice((page - 1) * itemsPerPage, page * itemsPerPage);
            pageItems.forEach(item => listEl.appendChild(renderItemFn(item)));
            renderPagination(paginationEl, page, totalPages, onPageChange);
        }

        function renderFastingHistory() {
            renderHistory(fastingHistoryList, fastingPaginationControls, allData.fasting, fastingCurrentPage, (item) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.dataset.docId = item.id;
                const hours = Math.floor(item.actualDurationHours);
                const minutes = Math.round((item.actualDurationHours - hours) * 60);
                const percentage = item.targetHours > 0 ? Math.round((item.actualDurationHours / item.targetHours) * 100) : 0;
                const format = (d) => `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
                let percentageClass = 'percentage-mid';
                if (percentage > 100) percentageClass = 'percentage-over-100';
                else if (percentage >= 70) percentageClass = 'percentage-high';
                else if (percentage <= 30) percentageClass = 'percentage-low';
                li.innerHTML = `<div class="history-info"><div class="duration">${hours}시간 ${minutes}분</div><div class="period">${format(item.startTime)}~${format(item.endTime)}</div></div><div class="history-actions"><div class="history-percentage ${percentageClass}">${percentage}%</div><button class="delete-btn" title="기록 삭제">×</button></div>`;
                return li;
            }, (newPage) => { fastingCurrentPage = newPage; renderFastingHistory(); });
        }

        function renderExerciseHistory() {
             renderHistory(exerciseHistoryList, exercisePaginationControls, allData.exercise, exerciseCurrentPage, (item) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                const format = (d) => `${d.getMonth()+1}/${d.getDate()}`;
                li.innerHTML = `<div class="history-info"><div class="type">${item.type}</div><div class="details">${format(item.date)} / ${item.duration}분</div></div><div class="history-calories">${item.calories || 0} <span class="unit">kcal</span></div>`;
                return li;
            }, (newPage) => { exerciseCurrentPage = newPage; renderExerciseHistory(); });
        }

        // 5. 차트 관련 함수
        const newIconPlugin = {
    id: 'newIconPlugin',
    afterDraw: (chart) => {
        const ctx = chart.ctx;
        const sixHoursAgo = new Date(Date.now() - 6 * 60 * 60 * 1000);
        const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const pointColor = isDarkMode ? '#888888' : '#7FE89B';
        const newPointColor = '#ffd400'; // 6시간 내 데이터는 노란색
        
        chart.data.datasets.forEach((dataset, i) => {
            const meta = chart.getDatasetMeta(i);
            meta.data.forEach((element, index) => {
                const dataPoint = dataset.data[index];
                const { x, y } = element.getProps(['x', 'y'], true);
                const isNew = dataPoint.createdAt && dataPoint.createdAt > sixHoursAgo;
                
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, 2 * Math.PI);
                ctx.fillStyle = isNew ? newPointColor : pointColor;
                ctx.fill();
                ctx.restore();
            });
        });
    }
};

        function createChart(canvasId, label, data, customScaleOptions = {}) {
            if (allCharts[canvasId]) {
                allCharts[canvasId].destroy();
            }
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            
            const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            const lineColor = isDarkMode ? '#888888' : '#7FE89B';
            const bubbleBgColor = isDarkMode ? '#2a2a2a' : '#E1FDC5';
            const gridColor = isDarkMode ? '#333' : '#f0f0f0';
            const textColor = isDarkMode ? '#e0e0e0' : '#333';
            const textLightColor = isDarkMode ? '#888' : '#777';

            const chartData = (data || []).filter(d => d && typeof d.value === 'number' && !isNaN(d.value)).map(d => ({ x: d.date, y: d.value, createdAt: d.createdAt }));

            allCharts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                            label: label,
    data: chartData,
    borderColor: lineColor,
    borderWidth: 2.5,
    tension: 0.2,
    // ✅ [수정] 기본 점 숨기기 - newIconPlugin이 그리는 점만 보이게
    pointRadius: 0,
    pointHoverRadius: 6,
    pointBackgroundColor: lineColor,
    fill: false,
    spanGaps: true
                    }]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: { unit: 'day', tooltipFormat: 'yyyy-MM-dd', displayFormats: { day: 'MM/dd' } },
                            grid: { color: gridColor },
                            ticks: { color: textColor }
                        },
                        y: {
                            beginAtZero: false,
                            grid: { color: gridColor },
                            ticks: { color: textColor, font: { weight: 'bold' } },
                            // ✅ [핵심] customScaleOptions 적용
                            ...customScaleOptions
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        zoom: { pan: { enabled: true, mode: 'x' }, zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' } },
                        tooltip: {
                            enabled: true,
                            mode: 'index',
                            intersect: false,
                            backgroundColor: bubbleBgColor,
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: false,
                            titleFont: { weight: 'normal', size: 13 },
                            titleColor: textLightColor,
                            bodyFont: { weight: 'bold', size: 14 },
                            bodyColor: textColor,
                            footerFont: { weight: 'normal', size: 12 },
                            footerColor: textLightColor,
                            callbacks: {
                                title: (tooltipItems) => new Date(tooltipItems[0].parsed.x).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }),
                                label: (context) => `${context.dataset.label}: ${context.parsed.y}`,
                                footer: (tooltipItems) => {
                                    const rawData = tooltipItems[0].raw;
                                    if (rawData.createdAt) return '기록 시간: ' + new Date(rawData.createdAt).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit', hour12: true });
                                    return '';
                                }
                            }
                        }
                    }
                },
                plugins: [newIconPlugin]
            });
        }

        function renderAllCharts() {
            const range = dateRangeSelector.value;
            const filterFn = (data) => {
                if (range === 'all' || !data) return data;
                const cutoffDate = new Date();
                cutoffDate.setDate(cutoffDate.getDate() - parseInt(range));
                return data.filter(d => d && d.date >= cutoffDate);
            };

            const filteredWeight = filterFn(allData.weight);
            const filteredBloodSugar = filterFn(allData.bloodSugar);
            const filteredKetone = filterFn(allData.ketone);

            // ============================================
            // 데이터 기반 동적 Y축 스케일 계산
            // ============================================

            // 체중: 데이터 기준 ±10 범위, 10단위
            const weightValues = (filteredWeight || []).map(d => d.value).filter(v => !isNaN(v));
            const weightMin = weightValues.length ? Math.floor(Math.min(...weightValues) / 10) * 10 - 10 : 30;
            const weightMax = weightValues.length ? Math.ceil(Math.max(...weightValues) / 10) * 10 + 10 : 120;
            const weightScaleOptions = {
                min: Math.max(0, weightMin),
                max: weightMax,
                ticks: { stepSize: 10 }
            };

            // 혈당: 40부터 시작, 20단위
            const bloodSugarValues = (filteredBloodSugar || []).map(d => d.value).filter(v => !isNaN(v));
            const bloodSugarMax = bloodSugarValues.length 
                ? Math.ceil(Math.max(...bloodSugarValues) / 20) * 20 + 40 
                : 200;
            const bloodSugarScaleOptions = {
                min: 40,
                max: Math.max(bloodSugarMax, 200),
                ticks: { stepSize: 20 }
            };

            // 케톤: 데이터 기준 동적 (최대값에 맞춰 확장)
            const ketoneValues = (filteredKetone || []).map(d => d.value).filter(v => !isNaN(v));
            const ketoneMaxValue = ketoneValues.length ? Math.max(...ketoneValues) : 1;
            const ketoneMax = Math.max(Math.ceil(ketoneMaxValue * 2) / 2 + 0.5, 2);
            const ketoneScaleOptions = {
                min: 0,
                max: ketoneMax,
                ticks: { stepSize: 0.5 }
            };

         !
            createChart('weightChart', '체중 (kg)', filteredWeight, weightScaleOptions);
            createChart('bloodSugarChart', '혈당 (mg/dL)', filteredBloodSugar, bloodSugarScaleOptions);
            createChart('ketoneChart', '케톤 (mmol/L)', filteredKetone, ketoneScaleOptions);
        }

        // 6. 이벤트 핸들러 연결
        let eventsWired = false;
        function wireEventsOnce() {
            if (eventsWired) return;
            eventsWired = true;
            
            homeBtn?.addEventListener('click', () => { window.location.href = 'fastmate.html'; });
            
            logoutBtn?.addEventListener('click', () => {
                if (confirm('정말 로그아웃하시겠습니까?')) {
                    signOutUser()
                        .then(() => {
                            alert('로그아웃 되었습니다.');
                            window.location.href = '/login.html';
                        })
                        .catch((error) => {
                            console.error("로그아웃 오류:", error);
                            alert("로그아웃 중 문제가 발생했습니다.");
                        });
                }
            });
            
            fastingHistoryList.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-btn')) {
                    const li = e.target.closest('.history-item');
                    if (li.dataset.docId) deleteFastingRecord(li.dataset.docId);
                }
            });
            
            // ✅ [핵심 수정] 탭 전환 이벤트 - 차트 리사이즈 추가
            tabs.forEach(tab => tab.addEventListener('click', () => {
                // 탭 활성화 상태 변경
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // 컨텐츠 표시/숨김
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                const tabContent = document.getElementById(tab.dataset.tab + 'Content');
                if (tabContent) tabContent.classList.add('active');
                
                // ✅ [추가] 탭 전환 시 해당 차트 리사이즈 & 업데이트
                const chartId = tab.dataset.tab + 'Chart';
                setTimeout(() => {
                    if (allCharts[chartId]) {
                        allCharts[chartId].resize();
                        allCharts[chartId].update();
                    }
                }, 50);
            }));
            
            dateRangeSelector.addEventListener('change', renderAllCharts);
        }

        // 7. 메인 로직: 데이터 로딩 및 앱 초기화
        async function loadAndRenderAllData() {
            if (!currentUser) return;
            try {
                const [profile, fasting, exercise, weight, bloodSugar, ketone] = await Promise.all([
                    getUserDoc(currentUser.uid),
                    fetchHistory('fastingHistory', 'endTime'),
                    fetchHistory('measurements/exercise/items'),
                    fetchHistory('measurements/weight/items'),
                    fetchHistory('measurements/bloodSugar/items'),
                    fetchHistory('measurements/ketone/items')
                ]);
                
                allData = { profile, fasting, exercise, weight, bloodSugar, ketone };

                renderProfileCard();
                renderFastingHistory();
                renderExerciseHistory();
                renderAllCharts();
                
                wireEventsOnce();
            } catch (error) { console.error("마이페이지 데이터 로딩 중 오류:", error); }
        }

        // 8. 최종 실행 지점: 인증 상태 리스너
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadAndRenderAllData();
            } else {
                // 비로그인 시 로그인 페이지로
                window.location.href = '/login.html';
            }
        });
    });
</script>
<!-- ============================================
     설정 모달 HTML
     ============================================ -->
<div id="settingsModal" class="settings-modal" style="display:none;">
    <div class="settings-modal-content">
        <div class="settings-header">
            <h3>⚙️ 설정</h3>
            <button id="closeSettingsBtn" class="settings-close-btn">✕</button>
        </div>
        
        <div class="settings-body">
            <div class="settings-section">
                <h4>🔔 알림 설정</h4>
                <p class="settings-desc" id="pushStatusText">알림 상태를 확인 중...</p>
                
                <button id="enablePushBtn" class="settings-btn-primary" style="display:none;">
                    알림 허용하기
                </button>
                
                <div id="pushOptions" class="push-options" style="display:none;">
                    <label class="toggle-item">
                        <span>
                            <strong>단식 시작 알림</strong>
                            <small>단식 시작 30분 전 리마인더</small>
                        </span>
                        <input type="checkbox" id="pushFastingStart" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    
                    <label class="toggle-item">
                        <span>
                            <strong>목표 달성 알림</strong>
                            <small>50%, 100% 달성 시 축하 알림</small>
                        </span>
                        <input type="checkbox" id="pushMilestone" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    
                    <label class="toggle-item">
                        <span>
                            <strong>단식 종료 알림</strong>
                            <small>목표 시간 30분, 1시간 전 알림</small>
                        </span>
                        <input type="checkbox" id="pushFastingEnd" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    
                    <label class="toggle-item">
                        <span>
                            <strong>장기 단식 마일스톤</strong>
                            <small>24시간 이상: 24h, 36h, 48h 알림</small>
                        </span>
                        <input type="checkbox" id="pushLongFasting" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    
                    <label class="toggle-item">
                        <span>
                            <strong>챌린지 알림</strong>
                            <small>챌린지 댓글, 초대 알림</small>
                        </span>
                        <input type="checkbox" id="pushChallenge" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    
                    <button id="savePushSettings" class="settings-btn-primary" style="margin-top:15px;">
                        설정 저장
                    </button>
                    
                    <button id="disablePushBtn" class="settings-btn-danger">
                        알림 끄기
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
 
<script>
document.addEventListener('DOMContentLoaded', () => {
    // ============================================
    // 설정 모달 이벤트
    // ============================================
    document.getElementById('settingsBtn')?.addEventListener('click', async () => {
        document.getElementById('settingsModal').style.display = 'flex';
        await updatePushStatusUI();
    });
     
    document.getElementById('closeSettingsBtn')?.addEventListener('click', () => {
        document.getElementById('settingsModal').style.display = 'none';
    });
     
    document.getElementById('settingsModal')?.addEventListener('click', (e) => {
        if (e.target.id === 'settingsModal') {
            e.target.style.display = 'none';
        }
    });
     
    document.getElementById('enablePushBtn')?.addEventListener('click', async () => {
        const btn = document.getElementById('enablePushBtn');
        btn.textContent = '권한 요청 중...';
        btn.disabled = true;
        
        const subscription = await requestPushPermission();
        
        if (subscription) {
            alert('🔔 알림이 활성화되었습니다!');
            await updatePushStatusUI();
        } else {
            alert('알림 권한이 거부되었습니다. 브라우저 설정에서 허용해주세요.');
            btn.textContent = '알림 허용하기';
            btn.disabled = false;
        }
    });
     
    document.getElementById('disablePushBtn')?.addEventListener('click', async () => {
        if (confirm('알림을 끄시겠습니까?')) {
            await disablePushNotifications();
            alert('알림이 비활성화되었습니다.');
            await updatePushStatusUI();
        }
    });
     
    document.getElementById('savePushSettings')?.addEventListener('click', async () => {
        const settings = {
            fastingStart: document.getElementById('pushFastingStart')?.checked ?? true,
            milestone: document.getElementById('pushMilestone')?.checked ?? true,
            fastingEnd: document.getElementById('pushFastingEnd')?.checked ?? true,
            longFasting: document.getElementById('pushLongFasting')?.checked ?? true,
            challenge: document.getElementById('pushChallenge')?.checked ?? true
        };
        
        try {
            const user = auth.currentUser;
            if (user) {
                await db.collection('users').doc(user.uid).set({
                    pushSettings: settings,
                    pushSettingsUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                alert('✅ 설정이 저장되었습니다!');
            }
        } catch (e) {
            console.error('설정 저장 실패:', e);
            alert('설정 저장에 실패했습니다.');
        }
    });
});

async function updatePushStatusUI() {
    const statusText = document.getElementById('pushStatusText');
    const enableBtn = document.getElementById('enablePushBtn');
    const pushOptions = document.getElementById('pushOptions');
    
    const status = await getPushStatus();
    
    if (!status.supported) {
        statusText.textContent = '❌ 이 브라우저는 알림을 지원하지 않습니다.';
        enableBtn.style.display = 'none';
        pushOptions.style.display = 'none';
        return;
    }
    
    if (status.permission === 'denied') {
        statusText.textContent = '🚫 알림이 차단되었습니다. 브라우저 설정에서 허용해주세요.';
        enableBtn.style.display = 'none';
        pushOptions.style.display = 'none';
        return;
    }
    
    if (status.subscribed) {
        statusText.textContent = '✅ 알림이 활성화되어 있습니다.';
        enableBtn.style.display = 'none';
        pushOptions.style.display = 'block';
        await loadPushSettings();
    } else {
        statusText.textContent = '알림을 허용하면 단식 리마인더를 받을 수 있어요.';
        enableBtn.style.display = 'block';
        pushOptions.style.display = 'none';
    }
}
 
async function loadPushSettings() {
    try {
        const user = auth.currentUser;
        if (!user) return;
        
        const doc = await db.collection('users').doc(user.uid).get();
        const data = doc.data();
        const settings = data?.pushSettings || {};
        
        document.getElementById('pushFastingStart').checked = settings.fastingStart ?? true;
        document.getElementById('pushMilestone').checked = settings.milestone ?? true;
        document.getElementById('pushFastingEnd').checked = settings.fastingEnd ?? true;
        document.getElementById('pushLongFasting').checked = settings.longFasting ?? true;
        document.getElementById('pushChallenge').checked = settings.challenge ?? true;
    } catch (e) {
        console.error('설정 불러오기 실패:', e);
    }
}
</script>
